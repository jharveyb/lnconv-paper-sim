[workspace]
resolver = "3"
members = ["crates/lnconv-core", "crates/lnconv-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lnconv-core = { path = "crates/lnconv-core" }
nexosim = "1.0"
serde = { version = "1", features = ["derive", "rc"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rand = "0.9"
rand_chacha = "0.9"
rustworkx-core = "0.17"
# Pin to whatever rustworkx-core 0.17 brings in transitively so the
# workspace and rustworkx-core agree on petgraph types.
petgraph = "0.8"
statrs = "0.18"
ahash = "0.8"
nohash-hasher = "0.2"
parking_lot = "0.12"
csv = "1"
twox-hash = { version = "2", features = ["xxhash3_64"] }
thiserror = "2"
parquet = { version = "55", features = ["zstd"] }
arrow-array = "55"
arrow-schema = "55"
glob = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
duckdb = { version = "1", features = ["bundled", "parquet"] }
crossbeam-channel = "0.5"
divan = "0.1"

# Add more perf-related settings
[profile.release]
# defaults
opt-level = 3
strip = "none"
debug-assertions = false
overflow-checks = false

# custom
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

# Bench profile mirrors release-tuning so microbench results reflect
# what the production binary actually runs. Full debuginfo (vs
# release's `line-tables-only`) helps Divan / samply when drilling
# into inlined call sites during bench profiling.
# Use an unreserved name (not bench) so hopefully we have a separate
# build output dir and don't step on release builds.
[profile.bench-release]
inherits = "release"
debug = "full"
