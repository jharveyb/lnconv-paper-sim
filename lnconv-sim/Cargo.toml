[workspace]
resolver = "3"
members = ["crates/lnconv-core", "crates/lnconv-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lnconv-core = { path = "crates/lnconv-core" }
nexosim = "1.0"
serde = { version = "1", features = ["derive", "rc"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rand = "0.9"
rand_chacha = "0.9"
rustworkx-core = "0.17"
# Pin to whatever rustworkx-core 0.17 brings in transitively so the
# workspace and rustworkx-core agree on petgraph types.
petgraph = "0.8"
statrs = "0.18"
ahash = "0.8"
nohash-hasher = "0.2"
parking_lot = "0.12"
csv = "1"
twox-hash = { version = "2", features = ["xxhash3_64"] }
thiserror = "2"
parquet = { version = "55", features = ["zstd"] }
arrow-array = "55"
arrow-schema = "55"
glob = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
duckdb = { version = "1", features = ["bundled", "parquet"] }
crossbeam-channel = "0.5"
