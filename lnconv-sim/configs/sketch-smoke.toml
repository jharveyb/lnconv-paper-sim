# Set-reconciliation smoke. Each (node, peer) pair has its own
# per-peer ticker that fires three Sketches per stagger window —
# one per kind (chan_updates, node_anns, chan_anns) at its own
# capacity. The receiver computes the symmetric diff against the
# sender's NodeState and replies with a Batch containing only the
# gossips the sender is strictly missing (stale versions are
# never forwarded).
seed = 1

[topology]
kind = "k_regular"
n = 200
k = 6

[channels]
count = 400

[latency]
dist = "constant"
ms = 100

[algo]
kind = "sketch"
stagger_ms = 5000
capacity_chan_updates = 128
capacity_node_anns = 64
capacity_chan_anns = 64

[event]
kind = "poisson_random"
rate_per_sec = 5.0

[run]
duration_seconds = 120
mailbox_capacity = 1024
progress_interval_seconds = 30
