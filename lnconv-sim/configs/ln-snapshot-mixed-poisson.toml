seed = 3

[topology]
kind = "from_csv"
nodes_csv = "init_data/node_list.csv"
channels_csv = "init_data/channel_list.csv"
enforce_hub_cap = true
# Per-node fallback can be 7 for now

[topology.k]
flooding = 5
cln = 10
lnd = 3

[latency]
dist = "constant"
ms = 100

# Match the (old) estimates of implementation diversity on mainnet.
[algo]
kind = "mix"
[[algo.population]]
fraction = 0.85
[algo.population.algo]
kind = "lnd"
stagger_ms = 90000
trickle_ms = 5000
min_batch_size = 10

[[algo.population]]
fraction = 0.15
[algo.population.algo]
kind = "cln"
stagger_ms = 60000

[event]
kind = "poisson_random"
rate_per_sec = 10.0

[run]
duration_seconds = 7200
mailbox_capacity = 1024
progress_interval_seconds = 60
