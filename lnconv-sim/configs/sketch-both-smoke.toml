# Sketch + flooding + full reconciliation: both optional behaviours
# enabled simultaneously. Flooding dominates initial propagation;
# full reconciliation cleans up any rare drops. Useful as the "kitchen
# sink" upper-bound on convergence speed for the sketch family.
seed = 1

[topology]
kind = "k_regular"
n = 200
k = 6

[channels]
count = 400

[latency]
dist = "constant"
ms = 100

[algo]
kind = "sketch"
stagger_ms = 5000
capacity_chan_updates = 128
capacity_node_anns = 64
capacity_chan_anns = 64
flood_on_originate = true
full_reconciliation = true

[event]
kind = "poisson_random"
rate_per_sec = 5.0

[run]
duration_seconds = 120
mailbox_capacity = 1024
progress_interval_seconds = 30
