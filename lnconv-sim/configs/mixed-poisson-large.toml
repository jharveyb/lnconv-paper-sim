seed = 2

[topology]
kind = "k_regular"
n = 20000
k = 10

[latency]
dist = "constant"
ms = 100

# Match the (old) estimates of implementation diversity on mainnet.
[algo]
kind = "mix"
[[algo.population]]
fraction = 0.7
[algo.population.algo]
kind = "lnd"
stagger_ms = 90000
trickle_ms = 5000
min_batch_size = 10

[[algo.population]]
fraction = 0.3
[algo.population.algo]
kind = "cln"
stagger_ms = 60000

[event]
kind = "poisson_random"
rate_per_sec = 7.0

[run]
duration_seconds = 3600
mailbox_capacity = 1024
progress_interval_seconds = 30
