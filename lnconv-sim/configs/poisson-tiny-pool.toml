# Small SCID pool to force supersession activity. With only 50 channels
# and 60s of Poisson at 7/s ≈ 420 events, each (scid, direction) gets
# ~4 updates → many MsgIds should finalize via supersession rather than
# 100% coverage.
seed = 1

[topology]
kind = "k_regular"
n = 1000
k = 8

[channels]
count = 50

[latency]
dist = "constant"
ms = 100

[algo]
kind = "cln"
stagger_ms = 1000

[event]
kind = "poisson_random"
rate_per_sec = 7.0

[run]
duration_seconds = 60
mailbox_capacity = 1024
progress_interval_seconds = 10
